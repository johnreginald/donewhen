name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: raenil
          POSTGRES_PASSWORD: raenil
          POSTGRES_DB: raenil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raenil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAENIL_TEST_DATABASE_URL: postgres://raenil:raenil@localhost:5432/raenil?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files need gofmt:"
            echo "$out"
            exit 1
          fi
      - name: go test
        run: go test ./... -count=1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build (includes check:ds)
        working-directory: web
        run: |
          npm ci
          npm run build

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plugin tests
        run: node --test 'plugin/scripts/*.test.mjs'
