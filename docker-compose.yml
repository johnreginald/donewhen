services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raenil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raenil}
      POSTGRES_DB: ${POSTGRES_DB:-raenil}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raenil}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  raenil:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAENIL_DATABASE_URL: postgres://${POSTGRES_USER:-raenil}:${POSTGRES_PASSWORD:-raenil}@db:5432/${POSTGRES_DB:-raenil}?sslmode=disable
      RAENIL_BASE_URL: ${RAENIL_BASE_URL:-http://localhost:8080}
      RAENIL_LISTEN_ADDR: ":8080"
      RAENIL_ENV: ${RAENIL_ENV:-prod}
      RAENIL_SESSION_SECRET: ${RAENIL_SESSION_SECRET}
      RAENIL_ISSUE_PREFIX: ${RAENIL_ISSUE_PREFIX:-K}
      RAENIL_VAPID_PUBLIC: ${RAENIL_VAPID_PUBLIC}
      RAENIL_VAPID_PRIVATE: ${RAENIL_VAPID_PRIVATE}
      RAENIL_VAPID_SUBJECT: ${RAENIL_VAPID_SUBJECT:-mailto:admin@localhost}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - raenil
    ports:
      - "80:80"
      - "443:443"
    environment:
      RAENIL_SITE_ADDRESS: ${RAENIL_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    restart: unless-stopped
