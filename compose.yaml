services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raenil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raenil}
      POSTGRES_DB: ${POSTGRES_DB:-raenil}
    volumes:
      # PG18+ wants the mount at the parent dir (data lands in a subdir).
      # NOTE: no :U here — that option is Podman-only and Docker rejects it.
      # Rootless Podman needs the host dir pre-owned instead; see docs/PODMAN.md.
      - ./data/pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raenil}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  raenil:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Publish on localhost only, for a host reverse proxy (Caddy/nginx) to front.
    # When using the bundled Caddy (profile "edge"), this is still harmless.
    ports:
      - "127.0.0.1:${RAENIL_HOST_PORT:-8090}:8080"
    environment:
      RAENIL_DATABASE_URL: postgres://${POSTGRES_USER:-raenil}:${POSTGRES_PASSWORD:-raenil}@db:5432/${POSTGRES_DB:-raenil}?sslmode=disable
      RAENIL_BASE_URL: ${RAENIL_BASE_URL:-http://localhost:8080}
      RAENIL_LISTEN_ADDR: ":8080"
      RAENIL_ENV: ${RAENIL_ENV:-prod}
      RAENIL_SESSION_SECRET: ${RAENIL_SESSION_SECRET}
      RAENIL_ISSUE_PREFIX: ${RAENIL_ISSUE_PREFIX:-R}
      RAENIL_VAPID_PUBLIC: ${RAENIL_VAPID_PUBLIC}
      RAENIL_VAPID_PRIVATE: ${RAENIL_VAPID_PRIVATE}
      RAENIL_VAPID_SUBJECT: ${RAENIL_VAPID_SUBJECT:-mailto:admin@localhost}
    restart: unless-stopped

  # Bundled edge TLS proxy — only for boxes with FREE 80/443.
  # Enable with:  make up PROFILE=edge   (or: <engine> compose --profile edge up -d)
  # If a host reverse proxy already owns 80/443, leave this disabled and point
  # that proxy at 127.0.0.1:${RAENIL_HOST_PORT:-8090}.
  #
  # Under rootless Podman, binding 80/443 needs a host sysctl — see docs/PODMAN.md.
  # Under Docker this works as-is.
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    depends_on:
      - raenil
    ports:
      - "80:80"
      - "443:443"
    environment:
      RAENIL_SITE_ADDRESS: ${RAENIL_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    restart: unless-stopped
